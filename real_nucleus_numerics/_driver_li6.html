<!DOCTYPE html><html><body style="margin:0;background:#000">
<pre id="out" style="color:#0f0;font:12px monospace">starting</pre>
<script>
window.__err = [];
window.onerror = function (m, src, l) { window.__err.push(m + ' @' + (src||'').split('/').pop() + ':' + l);
  var e = document.getElementById('out'); if (e) e.textContent = 'ERROR ' + window.__err.join(' | '); };
</script>
<script>

// RealNucleus Li-6 (Z=3, N=3) in the SAME harness as deuteron/He-4/He-3/tritium
// (molecule_nucleus.js, free outer boundary, locked proton subdivision, CONVERGENCE_THRESHOLD).
// p-e picture: 6 protons + 3 ELECTRONS.  N=Z (balanced), but the electron count (3) is ODD
// -> tests whether an odd ELECTRON core causes the same ambiguity that odd PROTON count did
// for He-3/tritium.  Direct analog of the -1 (He-3) / -2 (tritium) cores: a -3 electron core.
//   -3 electron core  +  inner proton triangle (3)  +  outer proton triangle (3, rotated).
// exp binding 31.99 MeV (5.33 MeV/nucleon).  Same deuteron calibration (0.8253 MeV/unit).
(function() {
  var gridN = 200, scr = 10, N2 = 100;
  var h = scr / gridN;
  var rIn = 0.7, rOut = 1.3;
  var atoms = [];

  atoms.push({ i: N2, j: N2, k: N2, Z: 3, el: 'e' });                              // 0: -3 electron core
  // inner proton triangle (MID), xy-plane, angles 0/120/240
  for (var t=0;t<3;t++){ var a=t*2*Math.PI/3;
    atoms.push({ i: Math.round(N2 + rIn*Math.cos(a)/h), j: Math.round(N2 + rIn*Math.sin(a)/h), k: N2, Z:1, el:'P' }); }
  // outer proton triangle (OUTER), xy-plane rotated 60 deg, angles 60/180/300
  for (t=0;t<3;t++){ var a2=(t*2+1)*Math.PI/3;
    atoms.push({ i: Math.round(N2 + rOut*Math.cos(a2)/h), j: Math.round(N2 + rOut*Math.sin(a2)/h), k: N2, Z:1, el:'P' }); }

  console.log('RealNucleus Li-6 matched: -3 core + inner proton triangle + outer proton triangle');

  window.USER_BOND_PAIRS = [ [1,2,"inP-P:"], [1,4,"in-out:"], [0,1,"e-Pin:"] ];
  window.USER_REFERENCE = { energy: "Li-6 (Z=3,N=3), 3e+6p; exp binding 31.99 MeV (5.33/nucleon)" };

  window.USER_NUCLEUS_MODE = true;
  window.USER_NN = gridN;
  window.USER_ATOMS = atoms;
  window.USER_SCREEN = scr;
  window.USER_STEPS = 1000000;
  window.USER_DYNAMICS = false;
  window.USER_FORCE_SCALE = 1.0;
  window.USER_ARROW_SCALE = 200.0;
  window.USER_DAMPING = 0.9;
  window.USER_N_MOVE = 50;
  window.USER_Z = [3, 1, 1, 1, 1, 1, 1];
  window.USER_Z_NUC = [0, 0, 0, 0, 0, 0, 0];
  window.USER_RC = [0, 0, 0, 0, 0, 0, 0];
  window.USER_MASS = [1, 1, 1, 1, 1, 1, 1];
  window.USER_CHARGE = [-3, 1, 1, 1, 1, 1, 1];
  window.USER_SHELL_RADIUS = 0.45;
  window.USER_SHELL_RADIUS2 = 0.95;
  window.USER_SHELL_INNER = [0];        // -3 electron core
  window.USER_SHELL_MID = [1, 2, 3];    // inner proton triangle
  window.USER_SHELL_OUTER = [4, 5, 6];  // outer proton triangle
  window.USER_CURV_REG = 0.5;
  window.USER_DIRICHLET_EP = 'electron';
  window.USER_LOCKED_GROUPS = [[1, 2, 3, 4, 5, 6]];
  window.INIT_ZEFF = 1;
  window.CONVERGENCE_THRESHOLD = 0.01;
})();




window.__label = 'li6';
window.__done = false;
window.onSweepDone = function (E) {
  if (window.__done) return;
  window.__done = true;
  var r = JSON.stringify({case: window.__label, E: Number(E), steps: window.__steps || null});
  document.title = 'RESULT ' + r;
  document.getElementById('out').textContent = 'RESULT ' + r;
  fetch('/__result?payload=' + encodeURIComponent(r));
};
// progress into the DOM so a --dump-dom shows how far it got even without convergence
setInterval(function () {
  if (window.__done) return;
  var e = document.getElementById('out');
  var g = 'gpu?';
  try { g = 'gpuReady=' + gpuReady + ' gpuError=' + (gpuError || 'none') + ' init=' + (typeof initProgress !== 'undefined' ? initProgress : '?'); }
  catch (ex) { g = 'gpu-binding: ' + ex.message; }
  if (e) e.textContent = 'PROGRESS E=' + (window._prevE === undefined ? 'n/a' : Number(window._prevE).toFixed(6))
                       + ' conv=' + (window._convCount || 0) + ' | ' + g;
}, 250);
</script>
<script src="/molecule_nucleus.js"></script>
<script src="/real_nucleus_numerics/p5.min.js"></script>
</body></html>
