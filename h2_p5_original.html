<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>H2 RealQM p5 original — R=1.5 au</title>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
let u = [];
let K = [];
let P = [];
let w = [];
let r = 0;
let E = 0;
let Ek = 0;
let Ep = 0;
let c = [];
let norm = [];
// N, and the separation D in cells, are now URL parameters so this can be run at the same
// R as the other two implementations. h = 8/N, so D = R/h = R*N/8.
let _q = new URLSearchParams(location.search);
let N = parseInt(_q.get('N') || '100');
let N2 = Math.round(N / 2);
let D = parseInt(_q.get('D') || '19');
let dt;
let h;
let t = 1;
let d = 0.1;
let M = 3;

function setup() {
  createCanvas(500, 420);
  h = 8 / N;
  dt = d * pow(h, 2);

  var actualR = D * h;
  console.log('H2: D=' + D + ' cells, R=' + actualR.toFixed(3) + ' au (' + (actualR*0.529177).toFixed(3) + ' A), h=' + h.toFixed(4));

  for (var m = 1; m < M; m++) {
    w[m] = [];
    u[m] = [];
    c[m] = 1;
    P[m] = [];
    norm[m] = 0;
  }
  for (var m = 1; m < M; m++) {
    for (var i = 0; i < N + 1; i++) {
      w[m][i] = [];
      u[m][i] = [];
      K[i] = [];
      P[m][i] = [];
      for (var j = 0; j < N + 1; j++) {
        w[m][i][j] = [];
        u[m][i][j] = [];
        K[i][j] = [];
        P[m][i][j] = [];
        for (var k = 0; k < N + 1; k++) {
          w[m][i][j][k] = 0;
          u[m][i][j][k] = 0;
          K[i][j][k] = 0;
          P[m][i][j][k] = 0;
        }
      }
    }
  }

  // Two Z=1 nuclei at N2-D/2 and N2+D/2
  var nuc1 = N2 - Math.round(D / 2);
  var nuc2 = N2 + Math.round(D / 2);

  for (var i = 0; i < N + 1; i++) {
    for (var j = 0; j < N + 1; j++) {
      for (var k = 0; k < N + 1; k++) {
        // Distance to nucleus 1
        var r1 = sqrt(pow((i - nuc1) * h, 2) + pow((j - N2) * h, 2) + pow((k - N2) * h, 2) + h * h);
        // Distance to nucleus 2
        var r2 = sqrt(pow((i - nuc2) * h, 2) + pow((j - N2) * h, 2) + pow((k - N2) * h, 2) + h * h);

        // Kernel: sum of both nuclei
        K[i][j][k] = 1 / r1 + 1 / r2;

        // Electron 1 near nucleus 1, electron 2 near nucleus 2
        u[1][i][j][k] = exp(-r1);
        u[2][i][j][k] = exp(-r2);
        P[1][i][j][k] = 0.5 / r2;  // P1 from electron 2's initial density
        P[2][i][j][k] = 0.5 / r1;  // P2 from electron 1's initial density
      }
    }
  }

  // Domain split at midplane i=N2, with gap
  for (var i = 0; i < N + 1; i++) {
    for (var j = 0; j < N + 1; j++) {
      for (var k = 0; k < N + 1; k++) {
        if (i < N2 - 1) {
          w[1][i][j][k] = 1;
        }
        if (i < N2 + 2) {
          u[2][i][j][k] = 0;
        }
        if (i > N2 + 1) {
          w[2][i][j][k] = 1;
        }
        if (i > N2 - 2) {
          u[1][i][j][k] = 0;
        }
        // Spherical cutoff on w
        var rc = sqrt(pow((i - N2) * h, 2) + pow((j - N2) * h, 2) + pow((k - N2) * h, 2));
        if (rc > 3.5) {
          w[1][i][j][k] = 0;
          w[2][i][j][k] = 0;
        }
      }
    }
  }

  // Nuclear repulsion V_KK = Z1*Z2/R
  var V_KK = 1 / (D * h);
  window._V_KK = V_KK;
  console.log('V_KK = ' + V_KK.toFixed(6));
}

function draw() {
  background(220);
  noStroke();

  if (t < 15000) {
    t = t + 1;
    E = 0;
    Ek = 0;
    Ep = 0;
    for (var i = 1; i < N; i++) {
      for (var j = 1; j < N; j++) {
        for (var k = 1; k < N; k++) {
          c[1] = 0.1 * (u[1][i][j][k] - u[2][i][j][k]);
          c[2] = 0.1 * (u[2][i][j][k] - u[1][i][j][k]);

          for (var m = 1; m < M; m++) {
            // Front tracking
            w[m][i][j][k] = w[m][i][j][k] + 2 * dt * abs(c[m]) * (w[m][i + 1][j][k] + w[m][i - 1][j][k] - 6 * w[m][i][j][k] + w[m][i][j + 1][k] + w[m][i][j - 1][k] + w[m][i][j][k + 1] + w[m][i][j][k - 1]) / pow(h, 2) + 10 * dt * c[m] * sqrt(pow((w[m][i + 1][j][k] - w[m][i - 1][j][k]) / h, 2) + pow((w[m][i][j + 1][k] - w[m][i][j - 1][k]) / h, 2) + pow((w[m][i][j][k + 1] - w[m][i][j][k - 1]) / h, 2));

            // ITP update
            u[m][i][j][k] = u[m][i][j][k] + 0.5 * d * ((u[m][i + 1][j][k] - u[m][i][j][k]) * (w[m][i + 1][j][k] + w[m][i][j][k]) / 2 - (u[m][i][j][k] - u[m][i - 1][j][k]) * (w[m][i][j][k] + w[m][i - 1][j][k]) / 2) + 0.5 * d * ((u[m][i][j + 1][k] - u[m][i][j][k]) * (w[m][i][j + 1][k] + w[m][i][j][k]) / 2 - (u[m][i][j][k] - u[m][i][j - 1][k]) * (w[m][i][j][k] + w[m][i][j - 1][k]) / 2) + 0.5 * d * ((u[m][i][j][k + 1] - u[m][i][j][k]) * (w[m][i][j][k + 1] + w[m][i][j][k]) / 2 - (u[m][i][j][k] - u[m][i][j][k - 1]) * (w[m][i][j][k] + w[m][i][j][k - 1]) / 2) + dt * (K[i][j][k] - 2 * P[m][i][j][k]) * u[m][i][j][k] * w[m][i][j][k];

            // Poisson
            P[1][i][j][k] = P[1][i][j][k] + dt * (P[1][i + 1][j][k] - 6 * P[1][i][j][k] + P[1][i - 1][j][k] + P[1][i][j + 1][k] + P[1][i][j - 1][k] + P[1][i][j][k + 1] + P[1][i][j][k - 1]) / pow(h, 2) + 2 * PI * dt * pow(u[2][i][j][k], 2);

            P[2][i][j][k] = P[2][i][j][k] + dt * (P[2][i + 1][j][k] - 6 * P[2][i][j][k] + P[2][i - 1][j][k] + P[2][i][j + 1][k] + P[2][i][j - 1][k] + P[2][i][j][k + 1] + P[2][i][j][k - 1]) / pow(h, 2) + 2 * PI * dt * pow(u[1][i][j][k], 2);

            // Energy
            if (w[m][i][j][k] > 0.5) {
              Ek = Ek + 0.5 * (pow(u[m][i + 1][j][k] - u[m][i][j][k], 2) + pow(u[m][i][j + 1][k] - u[m][i][j][k], 2) + pow(u[m][i][j][k + 1] - u[m][i][j][k], 2)) * h;
            }
            Ep = Ep + (P[m][i][j][k] - K[i][j][k]) * pow(u[m][i][j][k], 2) * pow(h, 3);
          }
        }
      }
    }

    E = Ep + Ek + window._V_KK;

    // Normalization
    for (var m = 1; m < M; m++) {
      norm[m] = 0;
      for (var i = 1; i < N; i++)
        for (var j = 1; j < N; j++)
          for (var k = 1; k < N; k++)
            norm[m] = norm[m] + pow(u[m][i][j][k], 2) * pow(h, 3);
      for (var i = 1; i < N; i++)
        for (var j = 1; j < N; j++)
          for (var k = 1; k < N; k++)
            u[m][i][j][k] = u[m][i][j][k] / sqrt(norm[m]);
    }
  }

  // Plots
  var nuc1 = N2 - Math.round(D / 2);
  var nuc2 = N2 + Math.round(D / 2);

  if (t / 10 - floor(t / 10) > 0.8) {
    for (var i = 1; i < N; i++) {
      for (var j = 1; j < N; j++) {
        fill(255, 50, 50, 255 * u[1][i][j][N2]);
        square(5 * i, 5 * j, 5);
        fill(50, 50, 255, 255 * u[2][i][j][N2]);
        square(5 * i, 5 * j, 5);
      }
    }
  }

  fill(0);
  circle(5 * nuc1, 5 * N2, 8);
  circle(5 * nuc2, 5 * N2, 8);

  for (var i = 0; i < N; i++) {
    fill(0);
    ellipse(5 * i, 300, 3);
    ellipse(5 * i, 200 - 100 * w[1][i][N2][N2], 4);
    ellipse(5 * i, 200 - 100 * w[2][i][N2][N2], 4);
    fill(255, 50, 50);
    ellipse(5 * i, 200 - 100 * u[1][i][N2][N2], 4);
    fill(50, 50, 255);
    ellipse(5 * i, 200 - 100 * u[2][i][N2][N2], 4);
    fill(0, 200, 200);
    ellipse(5 * i, 300 - 100 * (P[1][i][N2][N2] + P[2][i][N2][N2]), 3);
    fill(0, 0, 200);
    ellipse(5 * i, 300 - 30 * K[i][N2][N2], 4);
  }

  fill(0);
  textSize(13);
  var actualR = D * h;
  text("H2 RealQM p5 — R=" + actualR.toFixed(2) + " au (" + (actualR * 0.529177).toFixed(2) + " A)", 10, 20);
  text("step " + t, 10, 340);
  text("E = " + E.toFixed(4) + " Ha", 10, 360);
  text("T = " + Ek.toFixed(4), 10, 375);
  text("V_eK+V_ee = " + Ep.toFixed(4), 10, 390);
  text("V_KK = " + window._V_KK.toFixed(4), 10, 405);
  text("(ref: E(R=1.4)=-1.17 Ha)", 250, 360);
}
</script>
</body>
</html>
