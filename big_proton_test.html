<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#fff;font-family:monospace">
<div style="display:flex;flex-wrap:wrap;align-items:flex-start">
  <div id="results" style="background:rgba(0,0,0,0.92);border:1px solid #444;padding:12px;margin:10px;font-size:12px;min-width:620px"></div>
</div>
<pre id="log" style="margin:0;padding:8px;color:#8cf;font-size:12px">Building 1p vs 2p caging test...</pre>
<script>
// ===========================================================================
//  CAN A PROTON HOLD AN ELECTRON INSIDE?  —  1p vs 2p threshold (molecule_nucleus.js)
// ---------------------------------------------------------------------------
//  Energetic picture (RealNucleus): a POINT proton holds the electron only AROUND
//  it (atom); holding an electron INSIDE (compact) needs a CAGE of >=2 protons.
//  So a single proton (1p+1e) should FAIL to bind a compact electron -- the
//  electron expands out (= beta-decay) -- while two protons (2p+1e, deuteron)
//  should bind it.  All at the PHYSICAL boundary: Neumann + continuity
//  (USER_DIRICHLET_EP = false).
//
//  Rows: {1p+1e electron-in-proton-shell, 2p+1e deuteron} x {big proton m=1,
//  heavy proton m=1836}.  READ-OUT: total E (Ha), kinetic E_T, size proxy
//  1/sqrt(2 E_T) a0 (=1 for H), bound?  EXPECT: 1p big -> weak/no bind (electron
//  expands); 2p (either mass) -> bound; heavy 1p -> atom-like bound.
//
//  HOW TO RUN: open in Chrome/Edge with WebGPU. Auto-runs the 4 configs, one per
//  page-reload (~seconds each); fills the table + console.
//  HONEST LIMITS: grid h~0.08 a0 (cannot resolve a true fm electron) -> this
//  probes the ATOMIC-scale big/soft proton, i.e. the equal-size regime; a
//  positive/negative signal warrants a fine-grid follow-up.
// ===========================================================================
var A0_FM = 52917.7;
var configs = [
  { tag: '1p+1e  shell,     big proton  m=1',    type:'shell', mass: 1    },
  { tag: '1p+1e  shell,     heavy proton m=1836',type:'shell', mass: 1836 },
  { tag: '2p+1e  deuteron,  big proton  m=1',    type:'deut',  mass: 1    },
  { tag: '2p+1e  deuteron,  heavy proton m=1836',type:'deut',  mass: 1836 }
];

var idx = 0, results = {};
(function(){ var s = sessionStorage.getItem('bpt2');
  if (s){ var st = JSON.parse(s); idx = st.idx; results = st.results; sessionStorage.removeItem('bpt2'); } })();

if (idx < configs.length) {
  var cfg = configs[idx];
  var gridN = 128, scr = 10, gN2 = Math.round(gridN/2), h = scr/gridN;   // h ~ 0.078 a0
  window.USER_NUCLEUS_MODE = true;
  window.USER_NN = gridN;
  window.USER_SCREEN = scr;
  window.USER_STEPS = 6000;
  window.USER_DYNAMICS = false;
  window.USER_DIRICHLET_EP = false;            // ALL NEUMANN + continuity (the physical BC)
  window.USER_CURV_REG = 0.5;
  window.INIT_ZEFF = 1;
  window.CONVERGENCE_THRESHOLD = 0.02;
  if (cfg.type === 'shell') {
    window.USER_ATOMS = [
      { i: gN2, j: gN2, k: gN2, Z: 1, el: 'e' },   // 0 electron (-1), inner core
      { i: gN2, j: gN2, k: gN2, Z: 1, el: 'P' }    // 1 proton (+1), outer shell (same centre)
    ];
    window.USER_Z=[1,1]; window.USER_Z_NUC=[0,0]; window.USER_RC=[0,0];
    window.USER_MASS=[1, cfg.mass]; window.USER_CHARGE=[-1, 1];
    window.USER_SHELL_RADIUS = 1.0;
    window.USER_SHELL_INNER = [0]; window.USER_SHELL_OUTER = [1];
    window.USER_BOND_PAIRS = [[0, 1, "e-P:"]];
  } else { // deuteron: electron caged between two protons
    var R = 1.5, off = Math.max(1, Math.round((R/2)/h));
    window.USER_ATOMS = [
      { i: gN2,     j: gN2, k: gN2, Z: 1, el: 'e' },   // 0 electron (-1), the glue
      { i: gN2-off, j: gN2, k: gN2, Z: 1, el: 'P' },   // 1 proton (+1)
      { i: gN2+off, j: gN2, k: gN2, Z: 1, el: 'P' }    // 2 proton (+1)
    ];
    window.USER_Z=[1,1,1]; window.USER_Z_NUC=[0,0,0]; window.USER_RC=[0,0,0];
    window.USER_MASS=[1, cfg.mass, cfg.mass]; window.USER_CHARGE=[-1, 1, 1];
    window.USER_SHELL_RADIUS = Math.max(0.25, R/2);
    window.USER_SHELL_INNER = [0]; window.USER_SHELL_OUTER = [1, 2];
    window.USER_BOND_PAIRS = [[1, 2, "P-P:"], [0, 1, "e-P:"]];
  }
  document.getElementById('log').textContent =
    'run ' + (idx+1) + '/' + configs.length + ': ' + cfg.tag;
}

function sizeProxy(ET){ return ET>0 ? 1/Math.sqrt(2*ET) : NaN; }

function render() {
  var div = document.getElementById('results');
  var html = '<b style="color:#4fc3f7">Can a proton hold an electron inside? &mdash; 1p vs 2p threshold</b><br>'
    + '<span style="color:#888;font-size:11px">Neumann+cont boundary. A single proton should fail to hold a '
    + 'compact electron (it expands out = &beta;-decay); two protons (deuteron) should cage it. '
    + 'size proxy = 1/&radic;(2E<sub>T</sub>) a0 (=1 for H).</span><br><br>'
    + '<table style="border-collapse:collapse"><tr style="color:#4fc3f7">'
    + '<th style="padding:1px 8px;text-align:left">config</th><th>E (Ha)</th><th>E<sub>T</sub></th>'
    + '<th>e size (a0)</th><th>bound?</th></tr>';
  for (var i=0;i<configs.length;i++){
    var c=configs[i], r=results[i];
    var run=(idx<configs.length && idx===i && r===undefined);
    var sz = r? sizeProxy(r.ET) : NaN;
    var bound = r? (r.E < -0.02 ? '<span style="color:#0f0">yes</span>'
                                : '<span style="color:#ffb74d">weak/no</span>') : '';
    html += '<tr'+(run?' style="color:#ff0"':'')+'><td style="padding:1px 8px;text-align:left">'+c.tag+'</td>'
      + '<td style="text-align:center">'+(r?r.E.toFixed(3):(run?'run&hellip;':'&mdash;'))+'</td>'
      + '<td style="text-align:center">'+(r?r.ET.toFixed(3):'')+'</td>'
      + '<td style="text-align:center;color:#8cf">'+(r?sz.toFixed(3):'')+'</td>'
      + '<td style="text-align:center">'+bound+'</td></tr>';
  }
  html += '</table>';
  if (Object.keys(results).length === configs.length) {
    html += '<br><span style="color:#0f0"><b>Scan complete.</b></span> '
      + '<span style="color:#888;font-size:11px">Threshold reading: if the 1p rows are weak/no-bind (electron '
      + 'expands) while the 2p deuteron rows bind, the energetic picture is confirmed &mdash; one proton cannot '
      + 'cage a compact electron, two can.</span>';
  }
  div.innerHTML = html;
}
render();

window.onSweepDone = function(E, steps, E_T) {
  results[idx] = { E: E, ET: (E_T||0) };
  render();
  idx++;
  if (idx < configs.length){
    sessionStorage.setItem('bpt2', JSON.stringify({idx:idx, results:results}));
    setTimeout(function(){ location.reload(); }, 500);
  } else {
    console.log('=== 1p-vs-2p caging test done ===', JSON.stringify(results));
  }
};

if (idx < configs.length){
  var s = document.createElement('script');
  s.src = 'molecule_nucleus.js?t=' + Date.now();
  s.onload = function(){
    var p = document.createElement('script');
    p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
    document.body.appendChild(p);
  };
  document.body.appendChild(s);
}
</script>
</body></html>
